spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        stdio: true
        name: 1c-data-mcp
        version: 0.1.0
        annotation-scanner:
          enabled: true

datamcp:
  default-connection: ut
  cache:
    metadata-ttl-minutes: 30
  query:
    max-length: 10000
    max-rows: 1000
    timeout-seconds: 30
  connections:
    - name: ut
      url: http://localhost:8081/datamcp
      username: ${ONEC_USER:}
      password: ${ONEC_PASSWORD:}
