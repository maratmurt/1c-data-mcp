datamcp:
  default-connection: ut
  cache:
    metadata-ttl-minutes: 30
  query:
    max-length: 10000
    max-rows: 1000
    timeout-seconds: 30
  connections:
    - name: ut
      url: http://localhost:8081/datamcp
      username: ${ONEC_USER:}
      password: ${ONEC_PASSWORD:}
    - name: unreachable
      url: http://localhost:59999/datamcp
      username: test
      password: test
    - name: ut-copy
      url: http://localhost:9090/datamcp2
      username: ${ONEC_USER:}
      password: ${ONEC_PASSWORD:}
